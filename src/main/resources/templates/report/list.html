<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('Reporting &amp; Analytics Management')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('reports')}"></nav>

<div class="container my-4">
    <div class="page-header">
        <h1><i data-lucide="chart-column"></i> Reporting &amp; Analytics Management</h1>
        <a href="/reports/new" class="btn btn-primary icon-btn">
            <i data-lucide="file-plus-2"></i> New Report
        </a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                    <tr>
                        <th>Report Title</th>
                        <th>Type</th>
                        <th>Period</th>
                        <th>Generated By</th>
                        <th>Generated Date</th>
                        <th>Summary</th>
                        <th class="text-end">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="report : ${reports}">
                        <td th:text="${report.reportTitle}"></td>
                        <td><span class="badge-status" th:text="${report.reportType}"></span></td>
                        <td>
                            <span th:text="${report.periodStart}"></span>
                            &rarr;
                            <span th:text="${report.periodEnd}"></span>
                        </td>
                        <td th:text="${report.generatedBy}"></td>
                        <td th:text="${report.generatedDate}"></td>
                        <td style="max-width:280px;" class="text-truncate" th:text="${report.summary}"></td>
                        <td class="text-end">
                            <a th:href="@{/reports/edit/{id}(id=${report.id})}"
                               class="btn btn-sm btn-outline-secondary icon-btn">
                                <i data-lucide="pencil"></i> Edit
                            </a>
                            <button type="button" class="btn btn-sm btn-outline-danger icon-btn"
                                    data-bs-toggle="modal" data-bs-target="#deleteModal"
                                    th:attr="data-delete-url=@{/reports/delete/{id}(id=${report.id})},data-item-name=${report.reportTitle}">
                                <i data-lucide="trash-2"></i> Delete
                            </button>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(reports)}">
                        <td colspan="7" class="text-center text-muted py-4">No reports found.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: deleteModal}"></div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
