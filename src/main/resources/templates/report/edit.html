<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('Edit Report')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('reports')}"></nav>

<div class="container my-4">
    <div class="page-header">
        <h1><i data-lucide="file-text"></i> Edit Report</h1>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/reports/update/{id}(id=${report.id})}" th:object="${report}" method="post">
                <input type="hidden" th:field="*{id}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Report Title</label>
                        <input type="text" class="form-control" th:field="*{reportTitle}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Report Type</label>
                        <select class="form-select" th:field="*{reportType}" required>
                            <option value="">-- Select Type --</option>
                            <option value="INVENTORY">INVENTORY</option>
                            <option value="APPOINTMENTS">APPOINTMENTS</option>
                            <option value="ADVERSE_REACTIONS">ADVERSE_REACTIONS</option>
                            <option value="GENERAL">GENERAL</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Period Start</label>
                        <input type="date" class="form-control" th:field="*{periodStart}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Period End</label>
                        <input type="date" class="form-control" th:field="*{periodEnd}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Generated By</label>
                        <input type="text" class="form-control" th:field="*{generatedBy}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Generated Date</label>
                        <input type="date" class="form-control" th:field="*{generatedDate}" required>
                    </div>
                    <div class="col-md-12">
                        <label class="form-label">Summary</label>
                        <textarea class="form-control" th:field="*{summary}" rows="3"></textarea>
                    </div>
                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary icon-btn">
                        <i data-lucide="save"></i> Update
                    </button>
                    <a href="/reports" class="btn btn-outline-secondary icon-btn">
                        <i data-lucide="x"></i> Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
