<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <!--/* Common <head> content, reused via th:replace="~{fragments/layout :: pageHead(title)}" */-->
    <th:block th:fragment="pageHead(title)">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title th:text="${title} + ' | OpenVaccine'">OpenVaccine</title>
        <script>
            // Light theme by default; dark only if the user switched to it
            (function () {
                var theme = null;
                try { theme = localStorage.getItem('theme'); } catch (e) {}
                if (theme !== 'dark') {
                    theme = 'light';
                }
                document.documentElement.setAttribute('data-bs-theme', theme);
            })();
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
        <link rel="stylesheet" href="/css/style.css">
    </th:block>
</head>
<body>
    <!--/* Shared app shell (sidebar + mobile top bar), reused via th:replace="~{fragments/layout :: navbar(active)}" */-->
    <div th:fragment="navbar(active)">
        <header class="mobile-bar">
            <button type="button" class="icon-only" id="sidebarToggle" aria-label="Open menu"><i data-lucide="menu"></i></button>
            <a class="brand" href="/dashboard"><span class="brand-icon"><i data-lucide="syringe"></i></span> OpenVaccine</a>
            <button type="button" class="icon-only" data-theme-toggle aria-label="Toggle theme"><i data-lucide="moon"></i></button>
        </header>

        <aside class="app-sidebar" id="appSidebar">
            <a class="brand" href="/dashboard">
                <span class="brand-icon"><i data-lucide="syringe"></i></span>
                <span>OpenVaccine</span>
            </a>

            <nav class="side-nav">
                <span class="side-label">Overview</span>
                <a th:classappend="${active == 'dashboard'} ? 'active'" href="/dashboard"><i data-lucide="layout-dashboard"></i> Dashboard</a>

                <span class="side-label">Operations</span>
                <a th:classappend="${active == 'inventory'} ? 'active'" href="/inventory"><i data-lucide="package"></i> Inventory</a>
                <a th:classappend="${active == 'appointments'} ? 'active'" href="/appointments"><i data-lucide="calendar-clock"></i> Appointments</a>
                <a th:classappend="${active == 'dose-records'} ? 'active'" href="/dose-records"><i data-lucide="clipboard-check"></i> Dose Records</a>
                <a th:classappend="${active == 'centers'} ? 'active'" href="/centers"><i data-lucide="hospital"></i> Centers</a>

                <span class="side-label">Safety &amp; Insights</span>
                <a th:classappend="${active == 'adverse-reactions'} ? 'active'" href="/adverse-reactions"><i data-lucide="triangle-alert"></i> Adverse Reactions</a>
                <a th:classappend="${active == 'reports'} ? 'active'" href="/reports"><i data-lucide="chart-column"></i> Reports</a>
            </nav>

            <div class="side-footer">
                <button type="button" class="side-btn" data-theme-toggle><i data-lucide="moon"></i> <span>Toggle theme</span></button>
                <a class="side-btn" href="/logout"><i data-lucide="log-out"></i> <span>Log out</span></a>
            </div>
        </aside>
        <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    </div>

    <!--/* Shared delete-confirmation modal, reused via th:replace="~{fragments/layout :: deleteModal}" */-->
    <div th:fragment="deleteModal" class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body text-center p-4">
                    <span class="modal-icon"><i data-lucide="trash-2"></i></span>
                    <h5 class="mb-2">Delete this record?</h5>
                    <p class="text-muted mb-4">You are about to delete <strong id="deleteItemName"></strong>. This action cannot be undone.</p>
                    <div class="d-flex gap-2 justify-content-center">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                        <a id="confirmDeleteBtn" href="#" class="btn btn-danger icon-btn"><i data-lucide="trash-2"></i> Delete</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!--/* Shared page scripts, reused via th:replace="~{fragments/layout :: scripts}" */-->
    <th:block th:fragment="scripts">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            lucide.createIcons();

            // ---- Theme toggle (light / dark)
            document.querySelectorAll('[data-theme-toggle]').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    var root = document.documentElement;
                    var next = root.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
                    root.setAttribute('data-bs-theme', next);
                    try { localStorage.setItem('theme', next); } catch (e) {}
                });
            });

            // ---- Mobile sidebar
            var sidebar = document.getElementById('appSidebar');
            var toggle = document.getElementById('sidebarToggle');
            var backdrop = document.getElementById('sidebarBackdrop');
            if (sidebar && toggle && backdrop) {
                var setOpen = function (open) { document.body.classList.toggle('sidebar-open', open); };
                toggle.addEventListener('click', function () { setOpen(true); });
                backdrop.addEventListener('click', function () { setOpen(false); });
            }

            // ---- Success / error messages appear as toasts and disappear after 4 seconds
            setTimeout(function () {
                document.querySelectorAll('.alert:not(.attention-banner)').forEach(function (alertBox) {
                    alertBox.style.transition = 'opacity 0.4s, transform 0.4s';
                    alertBox.style.opacity = '0';
                    alertBox.style.transform = 'translateY(-8px)';
                    setTimeout(function () { alertBox.remove(); }, 400);
                });
            }, 4000);

            // ---- Delete modal
            var deleteModal = document.getElementById('deleteModal');
            if (deleteModal) {
                deleteModal.addEventListener('show.bs.modal', function (event) {
                    var trigger = event.relatedTarget;
                    document.getElementById('confirmDeleteBtn').setAttribute('href', trigger.getAttribute('data-delete-url'));
                    document.getElementById('deleteItemName').textContent = trigger.getAttribute('data-item-name');
                });
            }

            // ---- Live search above every list table
            document.querySelectorAll('main .card .table-responsive').forEach(function (wrap) {
                var table = wrap.querySelector('table');
                var rows = table.querySelectorAll('tbody tr');
                if (!table || rows.length === 0 || wrap.closest('#attention')) { return; }

                var bar = document.createElement('div');
                bar.className = 'table-toolbar';
                bar.innerHTML = '<label class="search-box"><i data-lucide="search"></i>' +
                    '<input type="search" placeholder="Search records..." aria-label="Search records"></label>' +
                    '<span class="result-count"></span>';
                wrap.parentNode.insertBefore(bar, wrap);
                lucide.createIcons();

                var input = bar.querySelector('input');
                var count = bar.querySelector('.result-count');
                var dataRows = Array.prototype.filter.call(rows, function (r) { return r.children.length > 1 && !r.querySelector('[colspan]'); });
                var update = function () {
                    var q = input.value.trim().toLowerCase();
                    var shown = 0;
                    dataRows.forEach(function (row) {
                        var match = row.textContent.toLowerCase().indexOf(q) !== -1;
                        row.style.display = match ? '' : 'none';
                        if (match) { shown++; }
                    });
                    count.textContent = shown + ' of ' + dataRows.length + ' records';
                };
                input.addEventListener('input', update);
                update();
            });

            // ---- Patient picker (auto-fills patient name)
            var patientNicSelect = document.getElementById('patientNicSelect');
            var patientNameInput = document.getElementById('patientNameInput');
            if (patientNicSelect && patientNameInput) {
                var syncPatientName = function () {
                    var selectedOption = patientNicSelect.options[patientNicSelect.selectedIndex];
                    patientNameInput.value = selectedOption ? (selectedOption.getAttribute('data-name') || '') : '';
                };
                patientNicSelect.addEventListener('change', syncPatientName);
                syncPatientName();
            }
        </script>
    </th:block>
</body>
</html>
