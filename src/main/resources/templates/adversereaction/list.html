<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('Adverse Reaction Monitoring')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('adverse-reactions')}"></nav>

<div class="container my-4">
    <div class="page-header">
        <h1><i data-lucide="triangle-alert"></i> Adverse Reaction Monitoring &amp; Incident Management</h1>
        <a href="/adverse-reactions/new" class="btn btn-primary icon-btn">
            <i data-lucide="plus"></i> Report Reaction
        </a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                    <tr>
                        <th>Patient Name</th>
                        <th>NIC</th>
                        <th>Vaccine</th>
                        <th>Center</th>
                        <th>Reaction</th>
                        <th>Severity</th>
                        <th>Reported Date</th>
                        <th>Action Taken</th>
                        <th class="text-end">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="reaction : ${adverseReactions}">
                        <td th:text="${reaction.patientName}"></td>
                        <td th:text="${reaction.patientNic}"></td>
                        <td th:text="${reaction.vaccineName}"></td>
                        <td th:text="${reaction.centerName}"></td>
                        <td style="max-width:260px;" class="text-truncate" th:text="${reaction.reactionDescription}"></td>
                        <td>
                            <span class="badge badge-status"
                                  th:classappend="${reaction.severity == 'SEVERE'} ? 'bg-danger' : (${reaction.severity == 'MODERATE'} ? 'bg-warning text-dark' : 'bg-info text-dark')"
                                  th:text="${reaction.severity}"></span>
                        </td>
                        <td th:text="${reaction.reportedDate}"></td>
                        <td th:text="${reaction.actionTaken}"></td>
                        <td class="text-end">
                            <a th:href="@{/adverse-reactions/edit/{id}(id=${reaction.id})}"
                               class="btn btn-sm btn-outline-secondary icon-btn">
                                <i data-lucide="pencil"></i> Edit
                            </a>
                            <button type="button" class="btn btn-sm btn-outline-danger icon-btn"
                                    data-bs-toggle="modal" data-bs-target="#deleteModal"
                                    th:attr="data-delete-url=@{/adverse-reactions/delete/{id}(id=${reaction.id})},data-item-name=${reaction.patientName}">
                                <i data-lucide="trash-2"></i> Delete
                            </button>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(adverseReactions)}">
                        <td colspan="9" class="text-center text-muted py-4">No adverse reaction records found.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: deleteModal}"></div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
