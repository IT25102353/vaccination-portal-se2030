<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('Edit Vaccination Center')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('centers')}"></nav>

<div class="container my-4">
    <div class="page-header">
        <h1><i data-lucide="hospital"></i> Edit Vaccination Center</h1>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/centers/update/{id}(id=${center.id})}" th:object="${center}" method="post">
                <input type="hidden" th:field="*{id}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Center Name</label>
                        <input type="text" class="form-control" th:field="*{centerName}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Address</label>
                        <input type="text" class="form-control" th:field="*{address}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">District</label>
                        <input type="text" class="form-control" th:field="*{district}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Contact Number</label>
                        <input type="text" class="form-control" th:field="*{contactNumber}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Capacity Per Day</label>
                        <input type="number" min="0" class="form-control" th:field="*{capacityPerDay}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Operating Hours</label>
                        <input type="text" class="form-control" th:field="*{operatingHours}"
                               placeholder="e.g. 8:00 AM - 4:00 PM" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Status</label>
                        <select class="form-select" th:field="*{status}" required>
                            <option value="">Select status</option>
                            <option value="ACTIVE">ACTIVE</option>
                            <option value="INACTIVE">INACTIVE</option>
                        </select>
                    </div>
                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary icon-btn">
                        <i data-lucide="save"></i> Update
                    </button>
                    <a href="/centers" class="btn btn-outline-secondary icon-btn">
                        <i data-lucide="x"></i> Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
