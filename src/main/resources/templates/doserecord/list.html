<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('Dose Administration Logs & Certificate System')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('dose-records')}"></nav>

<main class="container">
    <div class="page-header">
        <h1><i data-lucide="clipboard-check"></i> Dose Administration Logs &amp; Certificate System</h1>
        <a href="/dose-records/new" class="btn btn-primary icon-btn">
            <i data-lucide="clipboard-plus"></i> Add Dose Record
        </a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                    <tr>
                        <th>Patient Name</th>
                        <th>NIC</th>
                        <th>Vaccine</th>
                        <th>Dose No.</th>
                        <th>Date Administered</th>
                        <th>Administered By</th>
                        <th>Center</th>
                        <th>Certificate No.</th>
                        <th class="text-end">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="doseRecord : ${doseRecords}">
                        <td th:text="${doseRecord.patientName}"></td>
                        <td th:text="${doseRecord.patientNic}"></td>
                        <td th:text="${doseRecord.vaccineName}"></td>
                        <td th:text="${doseRecord.doseNumber}"></td>
                        <td th:text="${doseRecord.dateAdministered}"></td>
                        <td th:text="${doseRecord.administeredBy}"></td>
                        <td th:text="${doseRecord.centerName}"></td>
                        <td th:text="${doseRecord.certificateNumber}"></td>
                        <td class="text-end">
                            <a th:href="@{/dose-records/edit/{id}(id=${doseRecord.id})}"
                               class="btn btn-sm btn-outline-secondary icon-btn">
                                <i data-lucide="pencil"></i> Edit
                            </a>
                            <button type="button" class="btn btn-sm btn-outline-danger icon-btn"
                                    data-bs-toggle="modal" data-bs-target="#deleteModal"
                                    th:attr="data-delete-url=@{/dose-records/delete/{id}(id=${doseRecord.id})},data-item-name=${doseRecord.patientName}">
                                <i data-lucide="trash-2"></i> Delete
                            </button>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(doseRecords)}">
                        <td colspan="9" class="text-center text-muted py-4">No dose records found.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: deleteModal}"></div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
