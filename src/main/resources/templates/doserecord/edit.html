<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('Edit Dose Record')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('dose-records')}"></nav>

<main class="container">
    <div class="page-header">
        <h1><i data-lucide="file-check"></i> Edit Dose Record</h1>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/dose-records/update/{id}(id=${doseRecord.id})}" th:object="${doseRecord}" method="post">
                <input type="hidden" th:field="*{id}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Patient NIC</label>
                        <select class="form-select" id="patientNicSelect" th:field="*{patientNic}" required>
                            <option value="" disabled>Select a patient</option>
                            <option th:each="p : ${patients}" th:value="${p.patientNic}" th:attr="data-name=${p.patientName}"
                                    th:text="${p.patientName} + ' (' + ${p.patientNic} + ')'"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Patient Name</label>
                        <input type="text" class="form-control" id="patientNameInput" th:field="*{patientName}" readonly>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Vaccine Name</label>
                        <select class="form-select" th:field="*{vaccineName}" required>
                            <option value="" disabled>Select a vaccine</option>
                            <option th:each="name : ${vaccineNames}" th:value="${name}" th:text="${name}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Dose Number</label>
                        <input type="number" min="1" class="form-control" th:field="*{doseNumber}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Date Administered</label>
                        <input type="date" class="form-control" th:field="*{dateAdministered}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Administered By</label>
                        <input type="text" class="form-control" th:field="*{administeredBy}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Center Name</label>
                        <select class="form-select" th:field="*{centerName}" required>
                            <option value="" disabled>Select a center</option>
                            <option th:each="name : ${centerNames}" th:value="${name}" th:text="${name}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Certificate Number</label>
                        <input type="text" class="form-control" th:field="*{certificateNumber}" required>
                    </div>
                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary icon-btn">
                        <i data-lucide="save"></i> Update
                    </button>
                    <a href="/dose-records" class="btn btn-outline-secondary icon-btn">
                        <i data-lucide="x"></i> Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
