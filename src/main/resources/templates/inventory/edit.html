<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('Edit Vaccine Stock')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('inventory')}"></nav>

<main class="container">
    <div class="page-header">
        <h1><i data-lucide="package-search"></i> Edit Vaccine Stock</h1>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/inventory/update/{id}(id=${stock.id})}" th:object="${stock}" method="post">
                <input type="hidden" th:field="*{id}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Vaccine Name</label>
                        <input type="text" class="form-control" th:field="*{vaccineName}" pattern="[A-Za-z0-9 ]+" title="Only letters and numbers are allowed" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Batch Number</label>
                        <input type="text" class="form-control" th:field="*{batchNumber}" pattern="[A-Za-z0-9]+" title="Only letters and numbers are allowed" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Manufacturer</label>
                        <input type="text" class="form-control" th:field="*{manufacturer}" pattern="[A-Za-z0-9 ]+" title="Only letters and numbers are allowed" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Quantity Available</label>
                        <input type="number" min="0" class="form-control" th:field="*{quantityAvailable}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Received Date</label>
                        <input type="date" class="form-control" th:field="*{receivedDate}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Expiry Date</label>
                        <input type="date" class="form-control" th:field="*{expiryDate}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Storage Location</label>
                        <input type="text" class="form-control" th:field="*{storageLocation}" pattern="[A-Za-z0-9 ]+" title="Only letters and numbers are allowed" required>
                    </div>
                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary icon-btn">
                        <i data-lucide="save"></i> Update
                    </button>
                    <a href="/inventory" class="btn btn-outline-secondary icon-btn">
                        <i data-lucide="x"></i> Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
